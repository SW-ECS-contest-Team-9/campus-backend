# 운영 서버(트래커 서버)용. 값은 같은 폴더의 .env(= .env.server.example 복사본)에서 읽는다.
# 저장소 루트에서: docker compose -f deploy/compose.server.yml up -d --build --wait
name: campus-backend-server

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_backend}
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 에 POSTGRES_PASSWORD 를 넣으세요}
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    image: campus-backend-api:${API_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-campus_backend}
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 에 POSTGRES_PASSWORD 를 넣으세요}
      MAP_DATA_DIR: /data/releases
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRACKER_API: ${TRACKER_API:-http://100.93.21.92:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8010}:8010"
    volumes:
      - releases:/data/releases
      # 걷는 면(walkSurfaces) 원천. 읽기 전용. 경로가 없으면 Linux 도커는 up 이 멈추고, Docker Desktop 은 빈 폴더를 붙임(import-release.sh 가 막음).
      - type: bind
        source: ${STRUCTURES_DIR:-../../CampusTracker-Server/frontend/public/structures}
        target: /srv/structures
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WALKABLE_GEOJSON:-../mapdata/data/walkable-areas-5186.geojson}
        target: /srv/walkable-areas-5186.geojson
        read_only: true
        bind:
          create_host_path: false
      # 실내 빈 곳(복도·로비, 실내 층 그물 바닥). 읽기 전용. deploy/.env 에 INTERIORS_GEOJSON 이 없거나 비면 /dev/null 을
      # 붙여 실내 구조 없이 가져온다(그물은 복도 띠로만). 있는 경로를 적었는데 파일이 없으면 위처럼 up 이 멈춘다.
      - type: bind
        source: ${INTERIORS_GEOJSON:-/dev/null}
        target: /srv/interiors.geojson
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  pgdata:
    name: campus-backend-pgdata
  releases:
    name: campus-backend-releases
