repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-dotenv
        name: .env 커밋 금지 (.env.example 만 올림)
        entry: .env 파일은 커밋할 수 없습니다. .env.example 을 고치세요.
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: \.example$
