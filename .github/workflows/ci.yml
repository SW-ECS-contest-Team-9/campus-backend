name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v7

      - name: uv 설치
        uses: astral-sh/setup-uv@v9.0.0

      - name: Python 설치
        run: uv python install

      - name: 의존성 설치
        run: uv sync --locked

      - name: Python 문법 검사
        run: uv run python -m compileall main.py database.py errors.py routers mapdata scripts
